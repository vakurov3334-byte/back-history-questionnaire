'use strict';

const APP_ID='back-history-brief-v1';
const STORAGE_KEY=APP_ID+'-draft';
const allQuestions=SCHEMA.sections.flatMap(s=>s.questions);
const questionsById=new Map(allQuestions.map(q=>[q.id,q]));
const sectionsByQuestion=new Map(SCHEMA.sections.flatMap(s=>s.questions.map(q=>[q.id,s.id])));
let state={answers:{},step:0,persist:false,updatedAt:null};
let storageError=false,showUnanswered=false,toastTimer=null,confirmCallback=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name,size=18)=>{const shapes={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',back:'<path d="M19 12H5m6-6-6 6 6 6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/>',check:'<path d="m5 12 4 4L19 6"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',plus:'<path d="M12 5v14M5 12h14"/>',paper:'<path d="M7 3h10v18H7zM10 7h4m-4 4h4m-4 4h4"/>',print:'<path d="M6 9V3h12v6M6 17H3V9h18v8h-3M6 14h12v7H6z"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>'};return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shapes[name]||shapes.paper}</svg>`;};
function dateStamp(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isVisible(q,visited=new Set()){if(!q.when)return true;if(visited.has(q.id))return false;visited.add(q.id);const clauses=Array.isArray(q.when)?q.when:[q.when];return clauses.every(c=>{const parent=questionsById.get(c.id);if(!parent||!isVisible(parent,new Set(visited)))return false;const v=state.answers[c.id];return c.in?c.in.includes(v):c.has?Array.isArray(v)&&c.has.some(x=>v.includes(x)):false;});}
function visibleQuestions(section){return section.questions.filter(q=>isVisible(q));}
function isSpecial(v){return v==='__skip'||v==='__decline';}
function hasAnswer(q,v=state.answers[q.id]){if(isSpecial(v))return true;if(v===undefined||v===null||v==='')return false;switch(q.type){case'multi':return Array.isArray(v)&&v.length>0;case'date':return v&&typeof v==='object'&&(v.mode==='unknown'||v.mode==='never'||v.mode==='exact'&&!!v.date||v.mode==='approx'&&!!v.approx?.trim());case'table':return Array.isArray(v)&&v.some(row=>q.columns.some(col=>String(row?.[col.key]??'').trim()));case'tolerance':return v&&typeof v==='object'&&(v.mode&&v.mode!=='limited'||v.mode==='limited'&&v.minutes!==''&&v.minutes!==undefined&&Number.isFinite(Number(v.minutes))&&Number(v.minutes)>=0);default:return typeof v==='string'?v.trim().length>0:typeof v==='number'&&Number.isFinite(v);}}
function counts(){const active=allQuestions.filter(q=>isVisible(q));return{total:active.length,filled:active.filter(q=>hasAnswer(q)).length,answered:active.filter(q=>hasAnswer(q)&&!isSpecial(state.answers[q.id])).length,skipped:active.filter(q=>isSpecial(state.answers[q.id])).length};}
function activePayload(){const result={};for(const q of allQuestions){if(!isVisible(q)||!hasAnswer(q))continue;let v=state.answers[q.id];if(!isSpecial(v)){if(q.type==='date')v=v.mode==='exact'?{mode:v.mode,date:v.date}:v.mode==='approx'?{mode:v.mode,approx:v.approx}:{mode:v.mode};if(q.type==='tolerance')v=v.mode==='limited'?{mode:v.mode,minutes:v.minutes}:{mode:v.mode};if(q.type==='table')v=v.filter(row=>q.columns.some(c=>String(row?.[c.key]??'').trim())).map(row=>Object.fromEntries(q.columns.filter(c=>String(row?.[c.key]??'').trim()).map(c=>[c.key,row[c.key]])));}result[q.id]=v;}return result;}
function persist(){state.updatedAt=new Date().toISOString();if(state.persist){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({questionnaireId:APP_ID,version:1,...state}));storageError=false;}catch(e){storageError=true;}}updateChrome();}
function safeAnswers(raw){const out={};if(!raw||typeof raw!=='object'||Array.isArray(raw))throw new Error('Не найден список ответов.');for(const q of allQuestions){const v=raw[q.id];if(v===undefined||v===null)continue;if(isSpecial(v)){out[q.id]=v;continue;}switch(q.type){case'text':case'textarea':if(typeof v==='string')out[q.id]=v.slice(0,20000);break;case'single':if(q.options.includes(v))out[q.id]=v;break;case'multi':if(Array.isArray(v)){let a=[...new Set(v.filter(x=>q.options.includes(x)))];const exclusive=a.find(isExclusive);out[q.id]=exclusive?[exclusive]:a;}break;case'scale':if(v==='__unknown'||Number.isInteger(v)&&v>=0&&v<=10)out[q.id]=v;break;case'date':if(v&&typeof v==='object'&&['exact','approx','unknown','never'].includes(v.mode)){if(v.mode==='never'&&!q.allowNever)break;out[q.id]={mode:v.mode,date:/^\d{4}-\d{2}-\d{2}$/.test(v.date??'')?v.date:'',approx:typeof v.approx==='string'?v.approx.slice(0,1000):''};}break;case'tolerance':if(v&&typeof v==='object'&&['limited','unlimited','untested','unknown'].includes(v.mode))out[q.id]={mode:v.mode,minutes:typeof v.minutes==='string'||typeof v.minutes==='number'?String(v.minutes).slice(0,20):''};break;case'table':if(Array.isArray(v))out[q.id]=v.slice(0,q.maxRows||8).filter(x=>x&&typeof x==='object').map(row=>{const r={};for(const c of q.columns){const val=row[c.key];if(typeof val==='string'&&(!c.options||c.options.includes(val)))r[c.key]=val.slice(0,10000);}return r;});break;}}return out;}
try{const stored=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(stored&&stored.questionnaireId===APP_ID&&stored.persist===true){state={answers:safeAnswers(stored.answers),step:Math.max(0,Math.min(SCHEMA.sections.length,Number(stored.step)||0)),persist:true,updatedAt:stored.updatedAt||null};}}catch(e){storageError=true;}
function saveStatus(){if(storageError&&state.persist)return'Не удалось сохранить. Скачайте черновик.';if(!state.persist)return'Ответы пока только в этой вкладке.';return'Черновик сохранён в этом браузере.';}
function chrome(){const c=counts();return `<div class="shell"><header class="masthead"><div class="brand"><div class="brand-mark">${icon('paper',21)}</div><span>История симптомов</span></div><div class="head-actions"><button class="button" type="button" data-action="import">Открыть черновик</button></div></header><div class="intro"><div><div class="small-label">Анкета перед консультацией</div><h1>Боль в спине</h1><p>Ответьте на вопросы о начале боли, нагрузках и самочувствии. Если точные даты или цифры неизвестны, укажите приблизительно. Любой вопрос можно пропустить.</p></div><div class="intro-note">${SCHEMA.sections.length} разделов<br>Можно заполнять по частям</div></div><div class="layout"><aside class="sidebar" aria-label="Разделы анкеты"><div class="small-label sidebar-title">Ваша история</div><nav class="steps">${SCHEMA.sections.map((s,i)=>{const qs=visibleQuestions(s),n=qs.filter(q=>hasAnswer(q)).length;return `<button type="button" class="step ${state.step===i?'active':''} ${n===qs.length&&n>0?'done':''}" data-action="navigate" data-step="${i}" ${state.step===i?'aria-current="step"':''}><span class="step-index">${n===qs.length&&n>0?icon('check',14):String(i+1).padStart(2,'0')}</span><span class="step-text">${esc(s.shortTitle||s.title)}<span class="step-count" id="section-count-${s.id}">${n} / ${qs.length}</span></span></button>`;}).join('')}<button type="button" class="step ${state.step===SCHEMA.sections.length?'active':''}" data-action="navigate" data-step="${SCHEMA.sections.length}" ${state.step===SCHEMA.sections.length?'aria-current="step"':''}><span class="step-index">${icon('check',14)}</span><span class="step-text">Ответы и выгрузка<span class="step-count">Проверить и сохранить</span></span></button></nav><div class="storage-panel"><label class="check-line"><input type="checkbox" id="persist-toggle" data-persist ${state.persist?'checked':''}><span>Сохранять на этом устройстве</span></label><p class="save-status ${storageError&&state.persist?'error':''}" id="save-status" role="status">${saveStatus()}</p><div class="storage-actions"><button type="button" class="button subtle" data-action="draft">Скачать черновик</button><button type="button" class="button subtle" data-action="clear">Удалить ответы</button></div></div></aside><main id="main" tabindex="-1"><div class="form-panel">${state.step===SCHEMA.sections.length?renderReview():renderSection()}</div></main></div><footer class="global-footer"><p>Ответы не отправляются автоматически. После заполнения нажмите «Поделиться ответами» или скопируйте их в сообщение. Сохранение на устройстве можно отключить; кнопка «Удалить ответы» удаляет черновик из этой вкладки и браузера.</p><span>Анкета · версия 1</span></footer></div>`;}
function renderSection(){const s=SCHEMA.sections[state.step],qs=visibleQuestions(s),c=counts();return `<header class="section-header"><div class="section-meta"><span>РАЗДЕЛ ${String(state.step+1).padStart(2,'0')} / ${String(SCHEMA.sections.length).padStart(2,'0')}</span><span id="overall-count">${c.filled} из ${c.total} вопросов отмечено</span></div><h2 id="section-title" tabindex="-1">${esc(s.title)}</h2><p>${esc(s.description||'')}</p></header><div class="progress-track" role="progressbar" aria-label="Заполнение анкеты" aria-valuenow="${c.filled}" aria-valuemin="0" aria-valuemax="${c.total}"><div id="progress-bar" class="progress-bar" style="width:${c.total?c.filled/c.total*100:0}%"></div></div><div class="questions">${qs.map((q,i)=>renderQuestion(q,i+1)).join('')}</div>${navFooter()}`;}
function navFooter(){return `<div class="footer-nav"><button class="button subtle" type="button" data-action="previous" ${state.step===0?'disabled':''}>${icon('back',16)}Назад</button><span class="footer-hint">Незаполненные вопросы не блокируют переход</span>${state.step<SCHEMA.sections.length?`<button class="button primary" type="button" data-action="next">${state.step===SCHEMA.sections.length-1?'Проверить ответы':'Следующий раздел'}${icon('arrow',16)}</button>`:`<button class="button primary" type="button" data-action="share">Поделиться ответами</button>`}</div>`;}
function renderQuestion(q,num){const v=state.answers[q.id];const helpId='help-'+q.id;return `<section class="question" id="question-${q.id}" aria-labelledby="label-${q.id}"><div class="question-head"><span class="question-number">${String(num).padStart(2,'0')}</span><h3 class="question-title" id="label-${q.id}">${esc(q.label)}</h3></div><div class="question-body">${q.help?`<p class="help" id="${helpId}">${esc(q.help)}</p>`:''}${isSpecial(v)?`<div class="skip-state"><span>${v==='__decline'?'Предпочитаю не отвечать':'Вопрос пропущен'}</span><button type="button" class="text-button" data-action="unskip" data-q="${q.id}">Ответить</button></div>`:renderControl(q,v)}${!isSpecial(v)?`<div class="question-tools"><button type="button" class="text-button" data-action="skip" data-q="${q.id}">${sectionsByQuestion.get(q.id)==='health'?'Предпочитаю не отвечать':'Пропустить вопрос'}</button></div>`:''}${q.id==='urgent_signs'?urgentNotice():''}${q.id==='pain_maximum_24h'&&typeof state.answers.pain_average_24h==='number'&&typeof v==='number'&&v<state.answers.pain_average_24h?'<p class="validation-note">Максимальная боль указана ниже средней за те же 24 часа. Проверьте оба значения.</p>':''}</div></section>`;}
function options(q,value,type='single',field=null,customOptions=null){const opts=customOptions||q.options;return `<div class="options" role="group" aria-labelledby="label-${q.id}">${opts.map((option,i)=>{const label=typeof option==='string'?option:option.label,val=typeof option==='string'?option:option.value,checked=type==='multi'?Array.isArray(value)&&value.includes(val):value===val;return `<label class="choice ${checked?'selected':''}" for="control-${q.id}-${field||'option'}-${i}"><input id="control-${q.id}-${field||'option'}-${i}" type="${type==='multi'?'checkbox':'radio'}" name="${q.id}-${field||'option'}" data-q="${q.id}" ${field?`data-field="${field}"`:''} value="${esc(val)}" ${checked?'checked':''}><span>${esc(label)}</span></label>`;}).join('')}</div>`;}
function renderControl(q,v){const aria=`aria-labelledby="label-${q.id}" ${q.help?`aria-describedby="help-${q.id}"`:''}`;switch(q.type){case'text':return `<input class="text-input" id="control-${q.id}" type="text" data-q="${q.id}" value="${esc(v||'')}" ${aria} placeholder="${esc(q.placeholder||'Ваш ответ; можно приблизительно')}" maxlength="20000">`;case'textarea':return `<textarea id="control-${q.id}" data-q="${q.id}" ${aria} placeholder="${esc(q.placeholder||'Ваш ответ')}" maxlength="20000">${esc(v||'')}</textarea>`;case'single':case'multi':return options(q,v,q.type);case'scale':return `<div class="scale" role="group" ${aria}>${Array.from({length:11},(_,i)=>`<button type="button" id="control-${q.id}-${i}" data-action="scale" data-q="${q.id}" data-value="${i}" class="${v===i?'selected':''}" aria-pressed="${v===i}">${i}</button>`).join('')}<button type="button" id="control-${q.id}-unknown" class="unknown ${v==='__unknown'?'selected':''}" data-action="scale" data-q="${q.id}" data-value="unknown" aria-pressed="${v==='__unknown'}">Не могу оценить</button></div><div class="scale-anchors"><span>0 — боли нет</span><span>10 — самая сильная боль, которую можете представить</span></div>`;case'date':{const o=v&&typeof v==='object'?v:{};const opts=[{value:'exact',label:'Помню точную дату'},{value:'approx',label:'Могу указать примерно'},{value:'unknown',label:'Не помню'}];if(q.allowNever)opts.push({value:'never',label:'Ещё не обращалась'});return options(q,o.mode,'single','mode',opts)+(o.mode==='exact'?`<div class="detail-field"><label class="field-label" for="control-${q.id}-date">Дата</label><input class="text-input" type="date" id="control-${q.id}-date" data-q="${q.id}" data-field="date" value="${esc(o.date||'')}" max="${dateStamp()}">${o.date&&o.date>dateStamp()?'<p class="validation-note">Указана будущая дата. Проверьте, верно ли она записана.</p>':''}</div>`:o.mode==='approx'?`<div class="detail-field"><label class="field-label" for="control-${q.id}-approx">Примерная дата или период</label><input class="text-input" type="text" id="control-${q.id}-approx" data-q="${q.id}" data-field="approx" value="${esc(o.approx||'')}" placeholder="Например, конец июня 2026 года" maxlength="1000"></div>`:'');}case'tolerance':{const o=v&&typeof v==='object'?v:{};return options(q,o.mode,'single','mode',[{value:'limited',label:'Боль ограничивает время'},{value:'unlimited',label:'Боль не ограничивает'},{value:'untested',label:'Не пробовала / не было возможности оценить'},{value:'unknown',label:'Не могу оценить'}])+(o.mode==='limited'?`<div class="detail-field"><label class="field-label" for="control-${q.id}-minutes">Примерно сколько минут подряд?</label><div class="inline-input"><input class="text-input" type="number" min="0" max="1440" step="any" inputmode="decimal" id="control-${q.id}-minutes" data-q="${q.id}" data-field="minutes" value="${esc(o.minutes??'')}" placeholder="Минуты"><span class="unit">минут</span></div></div>`:'');}case'table':{const rows=Array.isArray(v)?v:[];return `<div class="repeat-list">${rows.length?rows.map((row,index)=>`<div class="repeat-row"><div class="repeat-head"><span>${q.id==='limited_activities'?'Действие':'Запись'} ${index+1}</span><button class="button subtle small" type="button" data-action="remove-row" data-q="${q.id}" data-row="${index}" aria-label="Удалить запись ${index+1}">${icon('close',13)}Удалить</button></div><div class="repeat-grid">${q.columns.map(col=>{const id=`control-${q.id}-${index}-${col.key}`,attrs=`id="${id}" data-q="${q.id}" data-row="${index}" data-col="${col.key}"`;return `<div class="${col.kind==='textarea'?'wide':''}"><label class="field-label" for="${id}">${esc(col.label)}</label>${col.kind==='textarea'?`<textarea ${attrs} maxlength="10000">${esc(row[col.key]||'')}</textarea>`:col.kind==='single'?`<select ${attrs}><option value="">Выберите ответ</option>${(col.options||[]).map(opt=>`<option value="${esc(opt)}" ${row[col.key]===opt?'selected':''}>${esc(opt)}</option>`).join('')}</select>`:`<input class="text-input" type="text" ${attrs} value="${esc(row[col.key]||'')}" maxlength="10000">`}</div>`;}).join('')}</div></div>`).join(''):'<div class="empty-state">Добавьте запись. Неизвестные детали можно оставить пустыми.</div>'}</div><button type="button" class="button small" data-action="add-row" data-q="${q.id}" ${rows.length>=(q.maxRows||8)?'disabled':''}>${icon('plus',14)}${q.id==='limited_activities'?'Добавить действие':'Добавить запись'}</button>`;}}return'';}
function isExclusive(v){return /^(Ничего из|Ни одного|Нет таких|Не знаю|Не помню|Не могу оценить|Ничего не|Помощи не было|Трудно указать|Предпочитаю|Не относится)/i.test(v);}
function urgentNotice(){const v=state.answers.urgent_signs;if(!Array.isArray(v)||!v.some(x=>!isExclusive(x)))return'';return `<div class="notice" role="alert"><strong>Не откладывайте медицинскую оценку ради анкеты.</strong>Новые нарушения мочеиспускания или контроля стула, потеря чувствительности в промежности либо нарастающая слабость требуют срочной очной оценки. При появлении этих симптомов обратитесь за неотложной помощью; при необходимости позвоните 112. Анкета не определяет причину симптомов.<br><a href="https://www.aans.org/patients/conditions-treatments/cauda-equina-syndrome/" target="_blank" rel="noopener noreferrer">Информация о симптомах — AANS</a></div>`;}
function formatAnswer(q,v=state.answers[q.id]){if(v==='__skip')return'Пропущено';if(v==='__decline')return'Предпочитаю не отвечать';if(!hasAnswer(q,v))return'Нет ответа';switch(q.type){case'multi':return v.join('; ');case'scale':return v==='__unknown'?'Не могу оценить':v+' / 10';case'date':if(v.mode==='unknown')return'Не помню';if(v.mode==='never')return'Ещё не обращалась';if(v.mode==='approx')return'Примерно: '+v.approx;return v.date?.split('-').reverse().join('.')||'Нет ответа';case'tolerance':return v.mode==='limited'?'Примерно '+v.minutes+' мин подряд':({unlimited:'Боль не ограничивает',untested:'Не пробовала / не было возможности оценить',unknown:'Не могу оценить'}[v.mode]||'Нет ответа');case'table':return v.filter(row=>q.columns.some(c=>String(row?.[c.key]??'').trim())).map((row,i)=>`${i+1}. `+q.columns.filter(c=>String(row[c.key]??'').trim()).map(c=>c.label+': '+row[c.key]).join('\n   ')).join('\n\n');default:return String(v);}}
function reviewSections(includeMissing=showUnanswered){return SCHEMA.sections.map((s,i)=>{const qs=visibleQuestions(s).filter(q=>includeMissing||hasAnswer(q));return `<section class="review-section"><div class="review-section-head"><h3>${esc(s.title)}</h3><button type="button" class="text-button" data-action="navigate" data-step="${i}">Изменить</button></div>${qs.length?qs.map(q=>`<div class="answer-item"><div class="answer-label">${esc(q.label)}</div><div class="answer-value">${esc(formatAnswer(q))}</div></div>`).join(''):'<p class="review-empty">Ответов в этом разделе пока нет.</p>'}</section>`;}).join('');}
function renderReview(){const c=counts();return `<header class="section-header"><div class="section-meta"><span>АНКЕТА ЗАПОЛНЯЕТСЯ НА ВАШЕМ УСТРОЙСТВЕ</span><span>Проверка ответов</span></div><h2 id="section-title" tabindex="-1">Ваши ответы</h2><p>Проверьте запись и сохраните её удобным способом. Можно вернуться в любой раздел и продолжить.</p></header><div class="review"><div class="review-intro">Нажмите «Поделиться ответами» и выберите приложение и получателя. Можно также скопировать ответы в сообщение или сохранить текстовый файл. Для продолжения на другом устройстве используйте «Скачать черновик» и «Открыть черновик».</div><div class="review-counts"><span>Ответов: ${c.answered}</span><span>Пропущено: ${c.skipped}</span><span>Без ответа: ${c.total-c.filled}</span></div><div class="review-actions"><button type="button" class="button primary" data-action="share">Поделиться ответами</button><button type="button" class="button" data-action="txt">${icon('download',16)}Скачать ответы .txt</button><button type="button" class="button" data-action="copy">${icon('copy',16)}Скопировать</button><button type="button" class="button" data-action="print">${icon('print',16)}Печать / PDF</button><button type="button" class="button" data-action="draft">Черновик .json</button></div><label class="review-filter"><input type="checkbox" id="show-unanswered" ${showUnanswered?'checked':''}>Показывать и включать в текст вопросы без ответа</label>${reviewSections()}</div>${navFooter()}`;}
function summaryText(){const c=counts();const lines=['АНКЕТА: ИСТОРИЯ БОЛИ В СПИНЕ','Сформировано: '+new Date().toLocaleString('ru-RU'),'Ответов: '+c.answered+'; пропущено: '+c.skipped+'; без ответа: '+(c.total-c.filled),'Сведения со слов заполнившей анкету. Не является диагнозом.',''];for(const s of SCHEMA.sections){const qs=visibleQuestions(s).filter(q=>showUnanswered||hasAnswer(q));if(!qs.length)continue;lines.push(s.title.toUpperCase(),'');for(const q of qs)lines.push(q.label,formatAnswer(q),'');}return lines.join('\n');}
function render(restoreFocus=false){let focus=null;if(restoreFocus){const a=document.activeElement;if(a?.id)focus={id:a.id,start:a.selectionStart,end:a.selectionEnd};}document.getElementById('app').innerHTML=chrome();if(focus){const next=document.getElementById(focus.id);if(next){next.focus({preventScroll:true});if(typeof next.setSelectionRange==='function'&&focus.start!==null)try{next.setSelectionRange(focus.start,focus.end);}catch(e){}}}}
function updateChrome(){const c=counts();const overall=document.getElementById('overall-count');if(overall)overall.textContent=`${c.filled} из ${c.total} вопросов отмечено`;const bar=document.getElementById('progress-bar');if(bar){bar.style.width=(c.total?c.filled/c.total*100:0)+'%';bar.parentElement.setAttribute('aria-valuenow',c.filled);bar.parentElement.setAttribute('aria-valuemax',c.total);}for(const s of SCHEMA.sections){const el=document.getElementById('section-count-'+s.id);if(el){const qs=visibleQuestions(s),filled=qs.filter(q=>hasAnswer(q)).length;el.textContent=filled+' / '+qs.length;el.closest('.step').classList.toggle('done',filled===qs.length&&filled>0);}}const status=document.getElementById('save-status');if(status){status.textContent=saveStatus();status.classList.toggle('error',storageError&&state.persist);}}
function setAnswer(id,v,repaint=false){state.answers[id]=v;persist();if(repaint)render(true);}
function navigate(step){state.step=Math.max(0,Math.min(SCHEMA.sections.length,step));persist();render();requestAnimationFrame(()=>document.getElementById('section-title')?.focus({preventScroll:true}));const target=document.getElementById('main');target?.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),4000);}
function download(content,name,type){const blob=new Blob([content],{type});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Файл подготовлен к скачиванию.');}
function showCopyDialog(message='Выделите и скопируйте текст ниже, затем вставьте его в сообщение.'){
  document.getElementById('copy-hint').textContent=message;
  const area=document.getElementById('copy-area');
  area.value=summaryText();
  document.getElementById('copy-dialog').showModal();
  area.focus();
  area.select();
}
async function copyAnswers(){
  try{
    if(!navigator.clipboard?.writeText)throw new Error('unavailable');
    await navigator.clipboard.writeText(summaryText());
    notify('Ответы скопированы. Вставьте их в сообщение.');
  }catch(err){showCopyDialog();}
}
async function shareAnswers(){
  if(typeof navigator.share!=='function'){
    showCopyDialog('В этом браузере меню передачи недоступно. Выделите и скопируйте текст ниже, затем вставьте его в сообщение.');
    return;
  }
  try{
    const text=summaryText();
    let data={title:'История боли в спине',text};
    if(typeof File==='function'&&typeof navigator.canShare==='function'){
      const file=new File(['\ufeff'+text],'anketa-spina-answers-'+dateStamp()+'.txt',{type:'text/plain;charset=utf-8'});
      if(navigator.canShare({files:[file]}))data={title:'История боли в спине',files:[file]};
    }
    await navigator.share(data);
  }catch(err){
    if(err?.name!=='AbortError')showCopyDialog('Не удалось открыть меню передачи. Выделите и скопируйте текст ниже, затем вставьте его в сообщение.');
  }
}
function exportDraft(){const data={questionnaireId:APP_ID,version:1,exportedAt:new Date().toISOString(),step:state.step,answers:activePayload()};download(JSON.stringify(data,null,2),'anketa-spina-draft-'+dateStamp()+'.json','application/json;charset=utf-8');}

function askConfirm(title,message,callback,buttonLabel='Продолжить'){document.getElementById('confirm-title').textContent=title;document.getElementById('confirm-message').textContent=message;document.getElementById('confirm-yes').textContent=buttonLabel;confirmCallback=callback;document.getElementById('confirm-dialog').showModal();}
function clearAnswers(){state={answers:{},step:0,persist:false,updatedAt:null};try{localStorage.removeItem(STORAGE_KEY);storageError=false;}catch(e){storageError=true;}render();document.getElementById('print-summary').innerHTML='';document.getElementById('copy-area').value='';notify(storageError?'Ответы в этой вкладке удалены; браузер не позволил проверить удаление сохранённого черновика.':'Ответы и сохранённый черновик удалены.');}
function preparePrint(){const content=SCHEMA.sections.map(s=>{const qs=visibleQuestions(s).filter(q=>showUnanswered||hasAnswer(q));if(!qs.length)return'';return `<h2>${esc(s.title)}</h2>`+qs.map(q=>`<div class="answer-item"><div class="answer-label">${esc(q.label)}</div><div class="answer-value">${esc(formatAnswer(q))}</div></div>`).join('');}).join('');document.getElementById('print-summary').innerHTML=`<h1>История боли в спине</h1><p class="print-meta">Ответы на анкету · ${esc(new Date().toLocaleString('ru-RU'))}<br>Сведения со слов заполнившей анкету. Не является диагнозом.</p>${content||'<p>Анкета пока не заполнена.</p>'}`;}
document.addEventListener('input',e=>{const el=e.target,id=el.dataset.q,q=questionsById.get(id);if(!q||['radio','checkbox'].includes(el.type)||el.tagName==='SELECT')return;if(el.dataset.row!==undefined){const rows=Array.isArray(state.answers[id])?[...state.answers[id]]:[];const i=Number(el.dataset.row);rows[i]={...rows[i],[el.dataset.col]:el.value};setAnswer(id,rows);return;}if(el.dataset.field){const o=state.answers[id]&&typeof state.answers[id]==='object'&&!Array.isArray(state.answers[id])?state.answers[id]:{};setAnswer(id,{...o,[el.dataset.field]:el.value});return;}setAnswer(id,el.value);});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='persist-toggle'){state.persist=el.checked;if(!el.checked){try{localStorage.removeItem(STORAGE_KEY);storageError=false;}catch(err){storageError=true;notify('Не удалось удалить ранее сохранённый черновик. Проверьте настройки хранения данных сайта в браузере.');}}persist();render(true);return;}if(el.id==='show-unanswered'){showUnanswered=el.checked;render(true);return;}const id=el.dataset.q,q=questionsById.get(id);if(!q)return;if(el.dataset.row!==undefined&&el.tagName==='SELECT'){const rows=Array.isArray(state.answers[id])?[...state.answers[id]]:[];const i=Number(el.dataset.row);rows[i]={...rows[i],[el.dataset.col]:el.value};setAnswer(id,rows);return;}if(el.type==='radio'){if(el.dataset.field){const o=state.answers[id]&&typeof state.answers[id]==='object'&&!Array.isArray(state.answers[id])?state.answers[id]:{};setAnswer(id,{...o,[el.dataset.field]:el.value},true);}else setAnswer(id,el.value,true);return;}if(el.type==='checkbox'&&q.type==='multi'){let arr=Array.isArray(state.answers[id])?[...state.answers[id]]:[];if(el.checked){arr=isExclusive(el.value)?[el.value]:[...arr.filter(v=>!isExclusive(v)),el.value];}else arr=arr.filter(v=>v!==el.value);setAnswer(id,[...new Set(arr)],true);return;}if(el.type==='date')render(true);});
document.addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const action=btn.dataset.action,id=btn.dataset.q,q=questionsById.get(id);switch(action){case'navigate':navigate(Number(btn.dataset.step));break;case'next':navigate(state.step+1);break;case'previous':navigate(state.step-1);break;case'skip':setAnswer(id,sectionsByQuestion.get(id)==='health'?'__decline':'__skip',true);break;case'unskip':delete state.answers[id];persist();render();document.getElementById('label-'+id)?.scrollIntoView({block:'nearest'});break;case'scale':setAnswer(id,btn.dataset.value==='unknown'?'__unknown':Number(btn.dataset.value),true);break;case'add-row':{const rows=Array.isArray(state.answers[id])?[...state.answers[id]]:[];if(rows.length<(q.maxRows||8)){rows.push({});setAnswer(id,rows,true);document.getElementById(`control-${id}-${rows.length-1}-${q.columns[0].key}`)?.focus({preventScroll:true});}break;}case'remove-row':{const rows=[...(state.answers[id]||[])];const i=Number(btn.dataset.row);const remove=()=>{rows.splice(i,1);setAnswer(id,rows,true);};if(q.columns.some(c=>String(rows[i]?.[c.key]??'').trim()))askConfirm('Удалить запись?','Эта запись будет удалена из текущего черновика.',remove,'Удалить');else remove();break;}case'draft':exportDraft();break;case'txt':download('\ufeff'+summaryText(),'anketa-spina-answers-'+dateStamp()+'.txt','text/plain;charset=utf-8');break;case'import':document.getElementById('draft-file').click();break;case'share':await shareAnswers();break;case'copy':await copyAnswers();break;case'close-copy':document.getElementById('copy-dialog').close();break;case'print':preparePrint();window.print();break;case'clear':askConfirm('Удалить все ответы?','Будут удалены ответы в этой вкладке и сохранённый черновик в этом браузере. Скачанные ранее файлы останутся у вас.',clearAnswers,'Удалить ответы');break;case'cancel-confirm':confirmCallback=null;document.getElementById('confirm-dialog').close();break;case'accept-confirm':{const cb=confirmCallback;confirmCallback=null;document.getElementById('confirm-dialog').close();if(cb)cb();break;}}});
document.getElementById('confirm-dialog').addEventListener('cancel',()=>{confirmCallback=null;});
document.getElementById('draft-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>1024*1024){notify('Файл слишком большой. Выберите JSON-черновик этой анкеты.');return;}try{const data=JSON.parse(await file.text());if(data.questionnaireId!==APP_ID||data.version!==1)throw new Error('Это не черновик этой версии анкеты.');const answers=safeAnswers(data.answers);const apply=()=>{state.answers=answers;state.step=Math.max(0,Math.min(SCHEMA.sections.length,Number(data.step)||0));persist();render();notify('Черновик открыт.');};if(Object.keys(state.answers).length)askConfirm('Открыть другой черновик?','Текущие ответы будут заменены ответами из файла. При необходимости сначала скачайте текущий черновик.',apply,'Открыть');else apply();}catch(err){notify(err.message==='Это не черновик этой версии анкеты.'?err.message:'Не удалось прочитать черновик. Выберите JSON-файл, скачанный из этой анкеты.');}});
window.addEventListener('beforeprint',preparePrint);
window.addEventListener('beforeunload',e=>{if((!state.persist||storageError)&&counts().filled>0){e.preventDefault();e.returnValue='';}});
render();
</script>
</body>
</html>
