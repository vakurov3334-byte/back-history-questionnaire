const SCHEMA={"sections":[{"id":"chronology","title":"Когда началась боль","shortTitle":"Начало боли","description":"Вспомни боль, из-за которой было сделано МРТ. Периоды можно указывать примерно: несколько смен, дней, недель или месяцев. Если чего-то не помнишь, так и ответь.","questions":[{"id":"urgent_signs","type":"multi","label":"Есть ли сейчас что-то из перечисленного, что появилось недавно или быстро усиливается?","help":"Отметь изменения относительно своего обычного состояния.","options":["Не получается помочиться или внезапно стало заметно труднее начать мочеиспускание","Появилась потеря контроля над мочой или стулом","Появилось онемение между ног, вокруг половых органов или ануса","За последние часы или дни быстро нарастает слабость в одной или обеих ногах","Ничего из перечисленного","Не знаю, как оценить"],"exclusive":["Ничего из перечисленного","Не знаю, как оценить"]},{"id":"pain_before_work","type":"single","label":"До этой работы у тебя уже бывали боль в спине, боль в ноге или ограничения из-за спины?","options":["Нет, до работы такого не было","Бывало, но к началу работы прошло","Боль или ограничения уже сохранялись в начале работы","Не помню"]},{"id":"prework_pain_details","type":"textarea","label":"Что ты помнишь о боли, которая была до этой работы?","help":"Когда впервые — хотя бы несколько лет или месяцев назад; где болело, как долго длились эпизоды и бывали ли промежутки без боли. Отдельно опиши самочувствие непосредственно перед работой.","when":{"id":"pain_before_work","in":["Бывало, но к началу работы прошло","Боль или ограничения уже сохранялись в начале работы"]}},{"id":"current_episode_relation","type":"single","label":"Когда начался тот эпизод боли, который ты сейчас описываешь?","help":"В первых разделах вспоминай эпизод, из-за которого ты проходила обследование. Нынешнее самочувствие опишешь отдельно. Если эта боль не прекращалась ещё до работы, выбери первый вариант.","options":["Ещё до этой работы","Во время первой смены","После первой смены, но до начала второй","Во время следующих смен или между ними, пока ещё работала","Уже после того, как прекратила эту работу","Трудно восстановить последовательность"]},{"id":"episode_work_interval","type":"text","label":"Какой промежуток между работой и началом этого эпизода ты помнишь?","help":"Например: после трёх смен; через две недели работы; вечером после первой смены; через несколько дней после окончания работы. Точность до дня не нужна.","when":{"id":"current_episode_relation","in":["Во время первой смены","После первой смены, но до начала второй","Во время следующих смен или между ними, пока ещё работала","Уже после того, как прекратила эту работу"]}},{"id":"work_exacerbation","type":"text","label":"Если боль была ещё до работы, когда она заметно усилилась — и усилилась ли вообще?","help":"Укажи примерно число смен или недель до усиления. Можно ответить «не усилилась», «изменился характер боли» или «не могу сравнить». Это отдельный вопрос об усилении, а не о первом появлении боли.","when":{"id":"current_episode_relation","in":["Ещё до этой работы"]}},{"id":"episode_duration","type":"single","label":"Сколько времени прошло с начала этого эпизода боли?","options":["Меньше недели","От недели до шести недель","Больше шести недель, но не больше трёх месяцев","Больше трёх месяцев","Трудно оценить"]},{"id":"current_episode_onset","type":"single","label":"Как начался этот эпизод или его заметное усиление?","options":["Сразу во время одного конкретного действия","Внезапно, но конкретного действия не было или не помню","Боль заметила позже, через некоторое время после нагрузки","Нарастала постепенно за несколько дней или недель","Трудно выделить начало"]},{"id":"onset_event_details","type":"textarea","label":"Что происходило в тот период и что ты почувствовала первым?","help":"Опиши уже известные тебе обстоятельства: действие, обычный день, падение или удар, если они были; когда появилась боль и как менялась в первые часы или дни. Если заметного события не было, так и напиши.","when":{"id":"current_episode_onset","in":["Сразу во время одного конкретного действия","Внезапно, но конкретного действия не было или не помню","Боль заметила позже, через некоторое время после нагрузки","Нарастала постепенно за несколько дней или недель"]}},{"id":"first_care_interval","type":"text","label":"Через какое время после начала боли или её усиления ты впервые обратилась за помощью?","help":"Примерно через сколько дней или недель. Если пока не обращалась, укажи это."}]},{"id":"work","title":"Работа и нагрузка","shortTitle":"Нагрузка","description":"Вспомни типичную смену и, если отличалась, самую тяжёлую. Название работодателя, адрес и имена других людей не нужны.","questions":[{"id":"work_period_schedule","type":"textarea","label":"Сколько всего дней или недель ты так работала и каким был график?","help":"Продолжительность работы в целом, часов за смену, смен за неделю и самый длинный рабочий день, если он отличался."},{"id":"work_status","type":"single","label":"Ты продолжаешь выполнять эту работу?","options":["Да, с прежней нагрузкой","Да, но нагрузку уменьшила или изменила","Закончила или приостановила","Трудно точно ответить"]},{"id":"work_tasks","type":"textarea","label":"Что именно ты делала на этой работе?","help":"Опиши основные задачи своими словами. Если задачи менялись, отметь это."},{"id":"work_actions","type":"multi","label":"Какие действия входили в работу?","options":["Поднимала или опускала предметы","Переносила предметы","Толкала или передвигала груз","Много раз наклонялась или поворачивала туловище","Долго стояла","Долго сидела","Другое","Не помню"],"exclusive":["Не помню"]},{"id":"work_loads","type":"table","label":"Какие грузы ты перемещала и как часто?","help":"Добавь обычный и самый тяжёлый груз. Вес можно оценить приблизительно или написать «не знаю». Укажи, если предмет только толкала. Неприменимые поля оставь пустыми.","when":{"id":"work_actions","has":["Поднимала или опускала предметы","Переносила предметы","Толкала или передвигала груз"]},"columns":[{"key":"kind","label":"Какой груз","kind":"single","options":["Обычный","Самый тяжёлый","Другой"]},{"key":"object","label":"Предмет и способ перемещения","kind":"text"},{"key":"weight","label":"Общий вес за один раз, примерно кг","kind":"text"},{"key":"frequency","label":"Сколько раз за час или за смену","kind":"text"},{"key":"height","label":"С какой высоты и на какую","kind":"text"},{"key":"distance","label":"Если переносила: расстояние за один раз","kind":"text"}],"maxRows":3},{"id":"work_postures","type":"textarea","label":"Как часто ты наклонялась или поворачивалась и сколько времени проводила в одном положении?","help":"Опиши только относящееся к твоей работе: примерно число наклонов или поворотов, был ли в руках груз, сколько стояла или сидела без смены положения.","when":{"id":"work_actions","has":["Много раз наклонялась или поворачивала туловище","Долго стояла","Долго сидела"]}},{"id":"work_breaks","type":"text","label":"Какие перерывы были во время смены?","help":"Примерно как часто, на сколько минут и можно ли было менять положение. Если перерывов не было, так и укажи."},{"id":"work_help","type":"multi","label":"Кто или что помогало тебе перемещать грузы?","options":["Другой человек","Тележка или другое средство перевозки","Подъёмное приспособление","Другая помощь","Помощи не было","Грузы не перемещала","Не помню"],"exclusive":["Помощи не было","Грузы не перемещала","Не помню"]},{"id":"work_change","type":"single","label":"Как эта нагрузка отличалась от привычной для тебя до работы?","options":["Была примерно привычной","Резко стала больше","Увеличивалась постепенно","Раньше похожей нагрузки не было","Не могу оценить"]},{"id":"work_break_response","type":"single","label":"Что происходило с болью в выходные или после уменьшения нагрузки?","options":["Становилась слабее или проходила","Становилась сильнее","Примерно не менялась","В разные перерывы было по-разному","Перерывов или уменьшения нагрузки не было","Не могу сравнить"]},{"id":"work_change_response","type":"textarea","label":"Какие перерывы или изменения нагрузки ты можешь сравнить?","help":"Сколько они длились и как быстро менялась боль? Начинала ли ты в тот же период лекарства, упражнения или другое лечение? Если уже возвращалась к работе, опиши, что было с симптомами после возвращения. Специально повторять нагрузку не нужно.","when":{"id":"work_break_response","in":["Становилась слабее или проходила","Становилась сильнее","Примерно не менялась","В разные перерывы было по-разному","Не могу сравнить"]}},{"id":"work_end_period","type":"text","label":"Как давно ты прекратила работу или изменила нагрузку?","help":"Примерно сколько дней, недель или месяцев назад; что именно стало иначе.","when":{"id":"work_status","in":["Да, но нагрузку уменьшила или изменила","Закончила или приостановила"]}}]},{"id":"symptoms","title":"Боль и ощущения в ногах","shortTitle":"Симптомы","description":"Раздели первые дни этого эпизода и последние семь дней. Описывай только то, что уже замечала; специально проверять движения или чувствительность не нужно.","questions":[{"id":"pain_first_days","type":"textarea","label":"Где болело в первые дни этого эпизода?","help":"Поясница, ягодица, бедро, голень, стопа или другое место; справа, слева или с обеих сторон. Если боль переходила из спины в ногу, опиши её путь и до какого места она доходила. Если в первые дни были онемение или изменения движений ноги, которые позже прошли, тоже отметь их."},{"id":"pain_last_7d","type":"textarea","label":"Где болело за последние семь дней?","help":"Укажи место, сторону и распространение боли отдельно от первых дней. Если болела нога, уточни, какая её часть и доходила ли боль ниже колена или до стопы. Можно ответить «боли не было»."},{"id":"symptom_course","type":"single","label":"Как в целом изменились симптомы с начала этого эпизода?","options":["Стали слабее или реже","Стали сильнее или чаще","Примерно не изменились","Заметно колеблются","Полностью прошли","Трудно оценить"]},{"id":"sensory_signs","type":"multi","label":"Были ли за последние семь дней такие ощущения в ягодице, ноге или стопе?","options":["Онемение","Покалывание или «мурашки»","При обычном прикосновении кожа чувствует слабее, чем раньше","Ничего из перечисленного","Не могу оценить"],"exclusive":["Ничего из перечисленного","Не могу оценить"]},{"id":"sensory_details","type":"textarea","label":"Где именно возникают эти ощущения и как они меняются?","help":"Сторона и область; появились ли сразу вместе с болью или позже; постоянные они или периодические; становятся ли заметнее. Если раньше ощущения были в другом месте, отметь это.","when":{"id":"sensory_signs","has":["Онемение","Покалывание или «мурашки»","При обычном прикосновении кожа чувствует слабее, чем раньше"]}},{"id":"leg_weakness","type":"single","label":"Замечала ли ты за последние семь дней, что нога подкашивается, стопа цепляется за пол или стало труднее двигать ногой?","options":["Да, есть такие изменения или ощущение слабости","Движения ограничивает только боль","Не замечала таких изменений","Не могу отличить слабость от ограничения из-за боли"]},{"id":"weakness_details","type":"textarea","label":"Что именно стало труднее при обычных действиях?","help":"Какая сторона, когда это началось, было ли раньше и нарастает ли сейчас. Например, уже замеченные изменения ходьбы или подъёма по лестнице. Никаких специальных проб выполнять не нужно.","when":{"id":"leg_weakness","in":["Да, есть такие изменения или ощущение слабости","Движения ограничивает только боль","Не могу отличить слабость от ограничения из-за боли"]}},{"id":"symptom_situations","type":"table","label":"Какие обычные ситуации усиливают или уменьшают боль?","help":"Вспомни уже замеченную реакцию на сидение, ходьбу, наклон, разгибание, отдых, кашель или другие ситуации. Можно указать, что действие не меняет боль.","columns":[{"key":"situation","label":"Ситуация или положение","kind":"text"},{"key":"change","label":"Что происходит с болью","kind":"single","options":["Усиливается","Ослабевает","Не меняется","Бывает по-разному","Не могу оценить"]},{"key":"timing","label":"Сразу или спустя какое время","kind":"text"}],"maxRows":5}]},{"id":"history","title":"Что было до работы","shortTitle":"Раньше","description":"Здесь нужны известные тебе события и документы до начала этой работы. Имена родственников и другие личные данные не нужны.","questions":[{"id":"sport_injury_history","type":"textarea","label":"Какие занятия и травмы спины или таза были у тебя до этой работы?","help":"Спорт, тренировки, физическая работа или регулярная домашняя нагрузка: чем занималась, как часто и как долго. Отдельно — заметные падения, удары, перерывы или резкое увеличение тренировок и симптомы после них. Можно написать, что травм или регулярных занятий не было."},{"id":"previous_records","type":"single","label":"Были ли обследования или записи врача о спине ещё до этой работы?","options":["Да, сохранились снимки и заключения","Да, есть только заключения или записи врача","Да, но документов сейчас нет","До работы таких обследований не было","Не помню"]},{"id":"previous_records_details","type":"textarea","label":"Что известно о тех обследованиях и прежних изменениях?","help":"Примерно за сколько месяцев или лет до работы; что обследовали и что сообщил врач. Отметь, есть ли сами изображения, а не только описание. Названия из документов можно переписать; самостоятельно объяснять их не нужно.","when":{"id":"previous_records","in":["Да, сохранились снимки и заключения","Да, есть только заключения или записи врача","Да, но документов сейчас нет"]}},{"id":"family_early_history","type":"single","label":"Известны ли в семье проблемы с позвоночником, начавшиеся ещё в детстве или молодости?","options":["Да, есть подтверждённый диагноз; жалобы начались в детстве или молодости","Подтверждённый диагноз известен, но когда начались проблемы, не знаю","Знаю о ранних жалобах, но подтверждённый диагноз неизвестен","Знаю только о проблемах, начавшихся зн const APP_ID='back-history-brief-personal-v2';

const allQuestions=SCHEMA.sections.flatMap(s=>s.questions);

const icon=(name,size=18)=>{const shapes={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',back:'<path d="M19 12H5m6-6-6 6 6 6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/>',check:'<path d="m5 12 4 4L19 6"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',plus:'<path d="M12 5v14M5 12h14"/>',paper:'<path d="M7 3h10v18H7zM10 7h4m-4 4h4m-4 4h4"/>',print:'<path d="M6 9V3h12v6M6 17H3V9h18v8h-3M6 14h12v7H6z"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>'};return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shapes[name]||shapes.paper}</svg>`;};
function dateStamp(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isVisible(q,visited=new Set()){if(!q.when)return true;if(visited.has(q.id))return false;visited.add(q.id);const clauses=Array.isArray(q.when)?q.when:[q.when];return clauses.every(c=>{const parent=questionsById.get(c.id);if(!parent||!isVisible(parent,new Set(visited)))return false;const v=state.answers[c.id];return c.in?c.in.includes(v):c.has?Array.isArray(v)&&c.has.some(x=>v.includes(x)):false;});}
function visibleQuestions(section){return section.questions.filter(q=>isVisible(q));}
function isSpecial(v){return v==='__skip'||v==='__decline';}
function hasAnswer(q,v=state.answers[q.id]){if(isSpecial(v))return true;if(v===undefined||v===null||v==='')return false;switch(q.type){case'multi':return Array.isArray(v)&&v.length>0;case'date':return v&&typeof v==='object'&&(v.mode==='unknown'||v.mode==='never'||v.mode==='exact'&&!!v.date||v.mode==='approx'&&!!v.approx?.trim());case'table':return Array.isArray(v)&&v.some(row=>q.columns.some(col=>String(row?.[col.key]??'').trim()));case'tolerance':return v&&typeof v==='object'&&(v.mode&&v.mode!=='limited'||v.mode==='limited'&&v.minutes!==''&&v.minutes!==undefined&&Number.isFinite(Number(v.minutes))&&Number(v.minutes)>=0);default:return typeof v==='string'?v.trim().length>0:typeof v==='number'&&Number.isFinite(v);}}
function counts(){const active=allQuestions.filter(q=>isVisible(q));return{total:active.length,filled:active.filter(q=>hasAnswer(q)).length,answered:active.filter(q=>hasAnswer(q)&&!isSpecial(state.answers[q.id])).length,skipped:active.filter(q=>isSpecial(state.answers[q.id])).length};}
function activePayload(){const result={};for(const q of allQuestions){if(!isVisible(q)||!hasAnswer(q))continue;let v=state.answers[q.id];if(!isSpecial(v)){if(q.type==='date')v=v.mode==='exact'?{mode:v.mode,date:v.date}:v.mode==='approx'?{mode:v.mode,approx:v.approx}:{mode:v.mode};if(q.type==='tolerance')v=v.mode==='limited'?{mode:v.mode,minutes:v.minutes}:{mode:v.mode};if(q.type==='table')v=v.filter(row=>q.columns.some(c=>String(row?.[c.key]??'').trim())).map(row=>Object.fromEntries(q.columns.filter(c=>String(row?.[c.key]??'').trim()).map(c=>[c.key,row[c.key]])));}result[q.id]=v;}return result;}
function persist(){state.updatedAt=new Date().toISOString();if(state.persist){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({questionnaireId:APP_ID,version:SCHEMA_VERSION,...state}));storageError=false;}catch(e){storageError=true;}}updateChrome();}
function safeAnswers(raw){const out={};if(!raw||typeof raw!=='object'||Array.isArray(raw))throw new Error('Не найден список ответов.');for(const q of allQuestions){const v=raw[q.id];if(v===undefined||v===null)continue;if(isSpecial(v)){out[q.id]=v;continue;}switch(q.type){case'text':case'textarea':if(typeof v==='string')out[q.id]=v.slice(0,20000);break;case'single':if(q.options.includes(v))out[q.id]=v;break;case'multi':if(Array.isArray(v)){let a=[...new Set(v.filter(x=>q.options.includes(x)))];const exclusive=a.find(x=>isExclusive(x,q));out[q.id]=exclusive?[exclusive]:a;}break;case'scale':if(v==='__unknown'||Number.isInteger(v)&&v>=0&&v<=10)out[q.id]=v;break;case'date':if(v&&typeof v==='object'&&['exact','approx','unknown','never'].includes(v.mode)){if(v.mode==='never'&&!q.allowNever)break;out[q.id]={mode:v.mode,date:/^\d{4}-\d{2}-\d{2}$/.test(v.date??'')?v.date:'',approx:typeof v.approx==='string'?v.approx.slice(0,1000):''};}break;case'tolerance':if(v&&typeof v==='object'&&['limited','unlimited','untested','unknown'].includes(v.mode))out[q.id]={mode:v.mode,minutes:typeof v.minutes==='string'||typeof v.minutes==='number'?String(v.minutes).slice(0,20):''};break;case'table':if(Array.isArray(v))out[q.id]=v.slice(0,q.maxRows||8).filter(x=>x&&typeof x==='object').map(row=>{const r={};for(const c of q.columns){const val=row[c.key];if(typeof val==='string'&&(!c.options||c.options.includes(val)))r[c.key]=val.slice(0,10000);}return r;});break;}}return out;}
try{const stored=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(stored&&stored.questionnaireId===APP_ID&&stored.version===SCHEMA_VERSION&&stored.persist===true){state={answers:safeAnswers(stored.answers),step:Math.max(0,Math.min(SCHEMA.sections.length,Number(stored.step)||0)),persist:true,updatedAt:stored.updatedAt||null};}}catch(e){storageError=true;}
function saveStatus(){if(storageError&&state.persist)return'Не удалось сохранить. Скачай черновик.';if(!state.persist)return'Ответы пока только в этой вкладке.';return'Черновик сохранён в этом браузере.';}
function hasLegacyDraft(){try{const old=JSON.parse(localStorage.getItem(LEGACY_ID+'-draft')||'null');return !!(old&&old.questionnaireId===LEGACY_ID&&old.persist);}catch(e){return false;}}
function legacyBanner(){return hasLegacyDraft()?'<p class="legacy-note">В этом браузере есть ответы прежней анкеты. <a href="v1.html">Открыть прежние ответы</a>. Они сохранены отдельно.</p>':'';}
function chrome(){const c=counts();return `<div class="shell"><header class="masthead"><div class="brand"><div class="brand-mark">${icon('paper',21)}</div><span>История симптомов</span></div><div class="head-actions"><button class="button" type="button" data-action="import">Открыть черновик</button></div></header><div class="intro"><div><div class="small-label">Уточняющая анкета</div><h1>Боль в пояснице</h1><p>Ответь о той работе с тяжёлой нагрузкой и о том, что происходило со спиной до неё и после. Достаточно примерных периодов и числа смен. Заключение МРТ переписывать не нужно. В конце нажми «Закончить и отправить», чтобы передать ответы владельцу анкеты в закрытую таблицу.</p></div><div class="intro-note">${SCHEMA.sections.length} разделов<br>Можно заполнять по частям</div></div>${legacyBanner()}<div class="layout"><aside class="sidebar" aria-label="Разделы анкеты"><div class="small-label sidebar-title">Твоя история</div><nav class="steps">${SCHEMA.sections.map((s,i)=>{const qs=visibleQuestions(s),n=qs.filter(q=>hasAnswer(q)).length;return `<button type="button" class="step ${state.step===i?'active':''} ${n===qs.length&&n>0?'done':''}" data-action="navigate" data-step="${i}" ${state.step===i?'aria-current="step"':''}><span class="step-index">${n===qs.length&&n>0?icon('check',14):String(i+1).padStart(2,'0')}</span><span class="step-text">${esc(s.shortTitle||s.title)}<span class="step-count" id="section-count-${s.id}">${n} / ${qs.length}</span></span></button>`;}).join('')}<button type="button" class="step ${state.step===SCHEMA.sections.length?'active':''}" data-action="navigate" data-step="${SCHEMA.sections.length}" ${state.step===SCHEMA.sections.length?'aria-current="step"':''}><span class="step-index">${icon('check',14)}</span><span class="step-text">Проверить и отправить<span class="step-count">Завершение анкеты</span></span></button></nav><div class="storage-panel"><label class="check-line"><input type="checkbox" id="persist-toggle" data-persist ${state.persist?'checked':''}><span>Сохранять на этом устройстве</span></label><p class="save-status ${storageError&&state.persist?'error':''}" id="save-status" role="status">${saveStatus()}</p><div class="storage-actions"><button type="button" class="button subtle" data-action="draft">Скачать черновик</button><button type="button" class="button subtle" data-action="clear">Удалить ответы</button></div></div></aside><main id="main" tabindex="-1">${state.step===0?'':urgentNotice()}<div class="form-panel">${state.step===SCHEMA.sections.length?renderReview():renderSection()}</div></main></div><footer class="global-footer"><p>Во время заполнения ответы остаются на твоём устройстве. По кнопке «Закончить и отправить» они передаются владельцу анкеты в закрытую таблицу; подтверждение приёма открывается отдельно. «Удалить ответы» очищает только эту вкладку и черновик в браузере, но не уже переданные ответы.</p><span>Уточняющая анкета · 2<span class="sources"><a href="https://www.nice.org.uk/guidance/ng59/chapter/recommendations" target="_blank" rel="noopener noreferrer">NICE: оценка боли</a><a href="https://www.aans.org/patients/conditions-treatments/cauda-equina-syndrome/" target="_blank" rel="noopener noreferrer">AANS: срочные симптомы</a></span></span></footer></div>`;}
function renderSection(){const s=SCHEMA.sections[state.step],qs=visibleQuestions(s),c=counts();return `<header class="section-header"><div class="section-meta"><span>РАЗДЕЛ ${String(state.step+1).padStart(2,'0')} / ${String(SCHEMA.sections.length).padStart(2,'0')}</span><span id="overall-count">${c.filled} из ${c.total} вопросов отмечено</span></div><h2 id="section-title" tabindex="-1">${esc(s.title)}</h2><p>${esc(s.description||'')}</p></header><div class="progress-track" role="progressbar" aria-label="Заполнение анкеты" aria-valuenow="${c.filled}" aria-valuemin="0" aria-valuemax="${c.total}"><div id="progress-bar" class="progress-bar" style="width:${c.total?c.filled/c.total*100:0}%"></div></div><div class="questions">${qs.map((q,i)=>renderQuestion(q,i+1)).join('')}</div>${navFooter()}`;}
function navFooter(){return `<div class="footer-nav"><button class="button subtle" type="button" data-action="previous" ${state.step===0?'disabled':''}>${icon('back',16)}Назад</button><span class="footer-hint">${state.step===SCHEMA.sections.length?'Подтверждение откроется отдельно':'Незаполненные вопросы не блокируют переход'}</span>${state.step<SCHEMA.sections.length?`<button class="button primary" type="button" data-action="next">${state.step===SCHEMA.sections.length-1?'Проверить ответы':'Следующий раздел'}${icon('arrow',16)}</button>`:renderSubmitButton()}</div>`;}
function renderQuestion(q,num){const v=state.answers[q.id];const helpId='help-'+q.id;return `<section class="question" id="question-${q.id}" aria-labelledby="label-${q.id}"><div class="question-head"><span class="question-number">${String(num).padStart(2,'0')}</span><h3 class="question-title" id="label-${q.id}">${esc(q.label)}</h3></div><div class="question-body">${q.help?`<p class="help" id="${helpId}">${esc(q.help)}</p>`:''}${isSpecial(v)?`<div class="skip-state"><span>${v==='__decline'?'Предпочитаю не отвечать':'Вопрос пропущен'}</span><button type="button" class="text-button" data-action="unskip" data-q="${q.id}">Ответить</button></div>`:renderControl(q,v)}${!isSpecial(v)?`<div class="question-tools"><button type="button" class="text-button" data-action="skip" data-q="${q.id}">${sectionsByQuestion.get(q.id)==='health'?'Предпочитаю не отвечать':'Пропустить вопрос'}</button></div>`:''}${q.id==='urgent_signs'?urgentNotice():''}${q.id==='pain_maximum_24h'&&typeof state.answers.pain_average_24h==='number'&&typeof v==='number'&&v<state.answers.pain_average_24h?'<p class="validation-note">Максимальная боль указана ниже средней за те же 24 часа. Проверь оба значения.</p>':''}</div></section>`;}
function options(q,value,type='single',field=null,customOptions=null){const opts=customOptions||q.options;return `<div class="options" role="group" aria-labelledby="label-${q.id}">${opts.map((option,i)=>{const label=typeof option==='string'?option:option.label,val=typeof option==='string'?option:option.value,checked=type==='multi'?Array.isArray(value)&&value.includes(val):value===val;return `<label class="choice ${checked?'selected':''}" for="control-${q.id}-${field||'option'}-${i}"><input id="control-${q.id}-${field||'option'}-${i}" type="${type==='multi'?'checkbox':'radio'}" name="${q.id}-${field||'option'}" data-q="${q.id}" ${field?`data-field="${field}"`:''} value="${esc(val)}" ${checked?'checked':''}><span>${esc(label)}</span></label>`;}).join('')}</div>`;}
function renderControl(q,v){const aria=`aria-labelledby="label-${q.id}" ${q.help?`aria-describedby="help-${q.id}"`:''}`;switch(q.type){case'text':return `<input class="text-input" id="control-${q.id}" type="text" data-q="${q.id}" value="${esc(v||'')}" ${aria} placeholder="${esc(q.placeholder||'Твой ответ; можно приблизительно')}" maxlength="20000">`;case'textarea':return `<textarea id="control-${q.id}" data-q="${q.id}" ${aria} placeholder="${esc(q.placeholder||'Твой ответ')}" maxlength="20000">${esc(v||'')}</textarea>`;case'single':case'multi':return options(q,v,q.type);case'scale':return `<div class="scale" role="group" ${aria}>${Array.from({length:11},(_,i)=>`<button type="button" id="control-${q.id}-${i}" data-action="scale" data-q="${q.id}" data-value="${i}" class="${v===i?'selected':''}" aria-pressed="${v===i}">${i}</button>`).join('')}<button type="button" id="control-${q.id}-unknown" class="unknown ${v==='__unknown'?'selected':''}" data-action="scale" data-q="${q.id}" data-value="unknown" aria-pressed="${v==='__unknown'}">Не могу оценить</button></div><div class="scale-anchors"><span>0 — боли нет</span><span>10 — самая сильная боль, которую можешь представить</span></div>`;case'date':{const o=v&&typeof v==='object'?v:{};const opts=[{value:'exact',label:'Помню точную дату'},{value:'approx',label:'Могу указать примерно'},{value:'unknown',label:'Не помню'}];if(q.allowNever)opts.push({value:'never',label:'Ещё не обращалась'});return options(q,o.mode,'single','mode',opts)+(o.mode==='exact'?`<div class="detail-field"><label class="field-label" for="control-${q.id}-date">Дата</label><input class="text-input" type="date" id="control-${q.id}-date" data-q="${q.id}" data-field="date" value="${esc(o.date||'')}" max="${dateStamp()}">${o.date&&o.date>dateStamp()?'<p class="validation-note">Указана будущая дата. Проверьте, верно ли она записана.</p>':''}</div>`:o.mode==='approx'?`<div class="detail-field"><label class="field-label" for="control-${q.id}-approx">Примерная дата или период</label><input class="text-input" type="text" id="control-${q.id}-approx" data-q="${q.id}" data-field="approx" value="${esc(o.approx||'')}" placeholder="Например, конец июня 2026 года" maxlength="1000"></div>`:'');}case'tolerance':{const o=v&&typeof v==='object'?v:{};return options(q,o.mode,'single','mode',[{value:'limited',label:'Боль ограничивает время'},{value:'unlimited',label:'Боль не ограничивает'},{value:'untested',label:'Не пробовала / не было возможности оценить'},{value:'unknown',label:'Не могу оценить'}])+(o.mode==='limited'?`<div class="detail-field"><label class="field-label" for="control-${q.id}-minutes">Примерно сколько минут подряд?</label><div class="inline-input"><input class="text-input" type="number" min="0" max="1440" step="any" inputmode="decimal" id="control-${q.id}-minutes" data-q="${q.id}" data-field="minutes" value="${esc(o.minutes??'')}" placeholder="Минуты"><span class="unit">минут</span></div></div>`:'');}case'table':{const rows=Array.isArray(v)?v:[];return `<div class="repeat-list">${rows.length?rows.map((row,index)=>`<div class="repeat-row"><div class="repeat-head"><span>${q.id==='limited_activities'?'Действие':'Запись'} ${index+1}</span><button class="button subtle small" type="button" data-action="remove-row" data-q="${q.id}" data-row="${index}" aria-label="Удалить запись ${index+1}">${icon('close',13)}Удалить</button></div><div class="repeat-grid">${q.columns.map(col=>{const id=`control-${q.id}-${index}-${col.key}`,attrs=`id="${id}" data-q="${q.id}" data-row="${index}" data-col="${col.key}"`;return `<div class="${col.kind==='textarea'?'wide':''}"><label class="field-label" for="${id}">${esc(col.label)}</label>${col.kind==='textarea'?`<textarea ${attrs} maxlength="10000">${esc(row[col.key]||'')}</textarea>`:col.kind==='single'?`<select ${attrs}><option value="">Выбери ответ</option>${(col.options||[]).map(opt=>`<option value="${esc(opt)}" ${row[col.key]===opt?'selected':''}>${esc(opt)}</option>`).join('')}</select>`:`<input class="text-input" type="text" ${attrs} value="${esc(row[col.key]||'')}" maxlength="10000">`}</div>`;}).join('')}</div></div>`).join(''):'<div class="empty-state">Добавь запись. Неизвестные детали можно оставить пустыми.</div>'}</div><button type="button" class="button small" data-action="add-row" data-q="${q.id}" ${rows.length>=(q.maxRows||8)?'disabled':''}>${icon('plus',14)}${q.id==='limited_activities'?'Добавить действие':'Добавить запись'}</button>`;}}return'';}
function isExclusive(v,q){if(q?.exclusive?.includes(v))return true;return /^(Ничего из|Ни одного|Нет таких|Не знаю|Не помню|Не могу оценить|Ничего не|Помощи не было|Трудно указать|Предпочитаю|Не относится)/i.test(v);}
function urgentNotice(){const v=state.answers.urgent_signs;if(!Array.isArray(v)||!v.some(x=>!isExclusive(x,questionsById.get('urgent_signs'))))return'';return `<div class="notice" role="alert"><strong>Не откладывай обращение за помощью ради анкеты.</strong>Новые нарушения мочеиспускания или контроля стула, потеря чувствительности в промежности либо нарастающая слабость требуют срочной очной оценки. Если они появились сейчас, обратись за неотложной помощью; при необходимости позвони 112. Анкета не определяет причину симптомов.<br><a href="https://www.aans.org/patients/conditions-treatments/cauda-equina-syndrome/" target="_blank" rel="noopener noreferrer">Информация о симптомах — AANS</a></div>`;}
function formatAnswer(q,v=state.answers[q.id]){if(v==='__skip')return'Пропущено';if(v==='__decline')return'Предпочитаю не отвечать';if(!hasAnswer(q,v))return'Нет ответа';switch(q.type){case'multi':return v.join('; ');case'scale':return v==='__unknown'?'Не могу оценить':v+' / 10';case'date':if(v.mode==='unknown')return'Не помню';if(v.mode==='never')return'Ещё не обращалась';if(v.mode==='approx')return'Примерно: '+v.approx;return v.date?.split('-').reverse().join('.')||'Нет ответа';case'tolerance':return v.mode==='limited'?'Примерно '+v.minutes+' мин подряд':({unlimited:'Боль не ограничивает',untested:'Не пробовала / не было возможности оценить',unknown:'Не могу оценить'}[v.mode]||'Нет ответа');case'table':return v.filter(row=>q.columns.some(c=>String(row?.[c.key]??'').trim())).map((row,i)=>`${i+1}. `+q.columns.filter(c=>String(row[c.key]??'').trim()).map(c=>c.label+': '+row[c.key]).join('\n   ')).join('\n\n');default:return String(v);}}
function reviewSections(includeMissing=showUnanswered){return SCHEMA.sections.map((s,i)=>{const qs=visibleQuestions(s).filter(q=>includeMissing||hasAnswer(q));return `<section class="review-section"><div class="review-section-head"><h3>${esc(s.title)}</h3><button type="button" class="text-button" data-action="navigate" data-step="${i}">Изменить</button></div>${qs.length?qs.map(q=>`<div class="answer-item"><div class="answer-label">${esc(q.label)}</div><div class="answer-value">${esc(formatAnswer(q))}</div></div>`).join(''):'<p class="review-empty">Ответов в этом разделе пока нет.</p>'}</section>`;}).join('');}
function renderReview(){const c=counts();const message=submissionStatusText();return `<header class="section-header"><div class="section-meta"><span>ПРОВЕРКА И ОТПРАВКА АНКЕТЫ</span><span>Последний шаг</span></div><h2 id="section-title" tabindex="-1">Твои ответы</h2><p>Проверь запись. Уточни, что ответы о последних сутках и неделе ещё актуальны.</p></header><div class="review"><div class="review-intro">По кнопке «Закончить и отправить» ответы будут переданы владельцу анкеты в закрытую таблицу. Страница подтверждения откроется отдельно; эта анкета останется открытой.</div><div class="review-counts"><span>Ответов: ${c.answered}</span><span>Пропущено: ${c.skipped}</span><span>Без ответа: ${c.total-c.filled}</span></div><div class="review-actions">${renderSubmitButton()}</div><p id="submit-status" class="help ${submissionError?'validation-note':''}" role="status" aria-live="polite" ${message?'':'hidden'}>${esc(message)}</p><p class="help">Если отправка не проходит, можно передать ответы другим способом.</p><div class="review-actions"><button type="button" class="button" data-action="share">Поделиться ответами</button><button type="button" class="button" data-action="copy">${icon('copy',16)}Скопировать</button><button type="button" class="button" data-action="txt">${icon('download',16)}Скачать ответы .txt</button><button type="button" class="button" data-action="print">${icon('print',16)}Печать / PDF</button><button type="button" class="button" data-action="draft">Черновик .json</button></div><label class="review-filter"><input type="checkbox" id="show-unanswered" ${showUnanswered?'checked':''}>Показывать и включать в текст вопросы без ответа</label>${reviewSections()}</div>${navFooter()}`;}
function summaryText(){const c=counts();const lines=['АНКЕТА: БОЛЬ В ПОЯСНИЦЕ И НАГРУЗКА','Сформировано: '+new Date().toLocaleString('ru-RU'),'Ответов: '+c.answered+'; пропущено: '+c.skipped+'; без ответа: '+(c.total-c.filled),'Сведения со слов заполнившей анкету. Версия вопросов: 2. Ответы требуют сопоставления с осмотром и снимками.',''];for(const s of SCHEMA.sections){const qs=visibleQuestions(s).filter(q=>showUnanswered||hasAnswer(q));if(!qs.length)continue;lines.push(s.title.toUpperCase(),'');for(const q of qs)lines.push(q.label,formatAnswer(q),'');}return lines.join('\n');}
function render(restoreFocus=false){let focus=null;if(restoreFocus){const a=document.activeElement;if(a?.id)focus={id:a.id,start:a.selectionStart,end:a.selectionEnd};}document.getElementById('app').innerHTML=chrome();if(focus){const next=document.getElementById(focus.id);if(next){next.focus({preventScroll:true});if(typeof next.setSelectionRange==='function'&&focus.start!==null)try{next.setSelectionRange(focus.start,focus.end);}catch(e){}}}}
function updateChrome(){const c=counts();const overall=document.getElementById('overall-count');if(overall)overall.textContent=`${c.filled} из ${c.total} вопросов отмечено`;const bar=document.getElementById('progress-bar');if(bar){bar.style.width=(c.total?c.filled/c.total*100:0)+'%';bar.parentElement.setAttribute('aria-valuenow',c.filled);bar.parentElement.setAttribute('aria-valuemax',c.total);}for(const s of SCHEMA.sections){const el=document.getElementById('section-count-'+s.id);if(el){const qs=visibleQuestions(s),filled=qs.filter(q=>hasAnswer(q)).length;el.textContent=filled+' / '+qs.length;el.closest('.step').classList.toggle('done',filled===qs.length&&filled>0);}}const status=document.getElementById('save-status');if(status){status.textContent=saveStatus();status.classList.toggle('error',storageError&&state.persist);}}
function setAnswer(id,v,repaint=false){state.answers[id]=v;persist();if(repaint)render(true);}
function navigate(step){state.step=Math.max(0,Math.min(SCHEMA.sections.length,step));persist();render();requestAnimationFrame(()=>document.getElementById('section-title')?.focus({preventScroll:true}));const target=document.getElementById('main');target?.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),4000);}
function download(content,name,type){const blob=new Blob([content],{type});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Файл подготовлен к скачиванию.');}
function showCopyDialog(message='Выдели и скопируй текст ниже, затем вставь его в сообщение.'){
  document.getElementById('copy-hint').textContent=message;
  const area=document.getElementById('copy-area');
  area.value=summaryText();
  document.getElementById('copy-dialog').showModal();
  area.focus();
  area.select();
}
async function copyAnswers(){
  try{
    if(!navigator.clipboard?.writeText)throw new Error('unavailable');
    await navigator.clipboard.writeText(summaryText());
    notify('Ответы скопированы. Вставь их в сообщение.');
  }catch(err){showCopyDialog();}
}
async function shareAnswers(){
  if(typeof navigator.share!=='function'){
    showCopyDialog('В этом браузере меню передачи недоступно. Выдели и скопируй текст ниже, затем вставь его в сообщение.');
    return;
  }
  try{
    const text=summaryText();
    let data={title:'История боли в спине',text};
    if(typeof File==='function'&&typeof navigator.canShare==='function'){
      const file=new File(['\ufeff'+text],'anketa-spina-v2-answers-'+dateStamp()+'.txt',{type:'text/plain;charset=utf-8'});
      if(navigator.canShare({files:[file]}))data={title:'История боли в спине',files:[file]};
    }
    await navigator.share(data);
  }catch(err){
    if(err?.name!=='AbortError')showCopyDialog('Не удалось открыть меню передачи. Выдели и скопируй текст ниже, затем вставь его в сообщение.');
  }
}
function submissionEndpoint(){
  const value=String(SUBMIT_ENDPOINT||'').trim();
  if(!value||value.startsWith('__'))return '';
  try{const url=new URL(value);return url.protocol==='https:'&&!url.username&&!url.password?url.href:'';}catch(err){return '';}
}
function submissionSendKey(){
  try{const value=new URLSearchParams(location.hash.slice(1)).get('send')||'';return /^[A-Za-z0-9_-]{32,80}$/.test(value)?value:'';}catch(err){return '';}
}
function submissionStatusText(){
  if(!submissionEndpoint())return 'Отправка пока не подключена. Сейчас доступны «Поделиться ответами», копирование и сохранение файла.';
  if(!submissionSendKey())return 'Для автоматической отправки открой анкету по полной ссылке, которую тебе прислали.';
  if(counts().answered===0)return 'Чтобы отправить анкету, ответь хотя бы на один вопрос. Одних пропусков недостаточно.';
  if(submissionCache&&submissionCache.signature!==JSON.stringify(activePayload()))return 'Ответы изменились после последней попытки отправки. Нажми «Закончить и отправить», чтобы передать обновлённый вариант.';
  return submissionMessage;
}
function renderSubmitButton(){
  const disabled=submissionBusy||!submissionEndpoint()||!submissionSendKey()||counts().answered===0;
  return `<button class="button primary" type="button" data-action="submit" aria-describedby="submit-status" aria-busy="${submissionBusy}" ${disabled?'disabled':''}>${submissionBusy?'Открываем страницу подтверждения…':'Закончить и отправить'}</button>`;
}
function updateSubmissionUi(){
  const disabled=submissionBusy||!submissionEndpoint()||!submissionSendKey()||counts().answered===0;
  document.querySelectorAll('[data-action="submit"]').forEach(button=>{
    button.disabled=disabled;
    button.setAttribute('aria-busy',String(submissionBusy));
    button.textContent=submissionBusy?'Открываем страницу подтверждения…':'Закончить и отправить';
  });
  const status=document.getElementById('submit-status');
  if(status){const message=submissionStatusText();status.textContent=message;status.hidden=!message;status.classList.toggle('validation-note',submissionError);}
}
function newSubmissionId(){
  if(typeof globalThis.crypto?.randomUUID==='function')return globalThis.crypto.randomUUID();
  if(typeof globalThis.crypto?.getRandomValues!=='function')throw new Error('Secure random unavailable');
  const bytes=new Uint8Array(16);globalThis.crypto.getRandomValues(bytes);
  bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
  const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
  return [hex.slice(0,8),hex.slice(8,12),hex.slice(12,16),hex.slice(16,20),hex.slice(20)].join('-');
}
function submissionEnvelope(sendKey=submissionSendKey()){
  const answers=activePayload();
  const signature=JSON.stringify(answers);
  if(submissionCache?.signature===signature&&submissionCache.envelope.sendKey===sendKey)return submissionCache.envelope;
  const questionLabels={},questionContext={};
  for(const section of SCHEMA.sections){
    for(const question of section.questions){
      if(!Object.prototype.hasOwnProperty.call(answers,question.id))continue;
      questionLabels[question.id]=question.label;
      questionContext[question.id]={
        sectionId:section.id,sectionTitle:section.title,type:question.type,help:question.help||'',
        ...(question.options?{options:[...question.options]}:{}),
        ...(question.columns?{columns:question.columns.map(column=>({key:column.key,label:column.label,kind:column.kind,...(column.options?{options:[...column.options]}:{})}))}:{})
      };
    }
  }
  const c=counts();
  const envelope={protocol:SUBMISSION_PROTOCOL,sendKey,submissionId:newSubmissionId(),questionnaireId:APP_ID,version:SCHEMA_VERSION,clientSubmittedAt:new Date().toISOString(),answers:JSON.parse(signature),questionLabels,questionContext,summaryText:summaryText(),answeredCount:c.answered,activeQuestionCount:c.total};
  submissionCache={signature,envelope};
  return envelope;
}
function submitAnswers(){
  if(submissionBusy)return;
  const endpoint=submissionEndpoint(),sendKey=submissionSendKey();
  if(!endpoint||!sendKey||counts().answered===0){submissionError=true;updateSubmissionUi();notify(submissionStatusText());return;}
  let form=null;
  try{
    const envelope=submissionEnvelope(sendKey);
    form=document.createElement('form');
    form.method='POST';form.action=endpoint;form.target='_blank';form.setAttribute('rel','noopener');
    form.acceptCharset='UTF-8';form.enctype='application/x-www-form-urlencoded';form.hidden=true;
    const submission=document.createElement('input');submission.type='hidden';submission.name='submission';submission.value=JSON.stringify(envelope);form.appendChild(submission);
    const website=document.createElement('input');website.type='text';website.name='website';website.value='';website.autocomplete='off';website.tabIndex=-1;form.appendChild(website);
    submissionBusy=true;submissionMessage='';submissionError=false;updateSubmissionUi();
    document.body.appendChild(form);
    form.submit();
    submissionMessage='Проверь отдельную вкладку со страницей подтверждения. Если она не открылась или там показана ошибка, повтори отправку. Ответы остаются в этой анкете.';
    updateSubmissionUi();
    submissionUnlockTimer=setTimeout(()=>{submissionBusy=false;submissionUnlockTimer=null;updateSubmissionUi();},1800);
    setTimeout(()=>form.remove(),1000);
  }catch(err){
    if(form)form.remove();
    submissionBusy=false;submissionError=true;
    submissionMessage='Не удалось начать отправку. Ответы остались в анкете. Попробуй ещё раз или используй один из способов ниже.';
    updateSubmissionUi();notify(submissionMessage);
  }
}
function resetSubmissionState(){
  submissionCache=null;submissionMessage='';submissionError=false;submissionBusy=false;
  clearTimeout(submissionUnlockTimer);submissionUnlockTimer=null;
}
function exportDraft(){const data={questionnaireId:APP_ID,version:SCHEMA_VERSION,exportedAt:new Date().toISOString(),updatedAt:state.updatedAt,step:state.step,answers:activePayload(),questionLabels:Object.fromEntries(allQuestions.filter(q=>isVisible(q)&&hasAnswer(q)).map(q=>[q.id,q.label])),questionContext:Object.fromEntries(allQuestions.filter(q=>isVisible(q)&&hasAnswer(q)).map(q=>[q.id,{help:q.help||"",...(q.columns?{columns:q.columns.map(c=>({key:c.key,label:c.label}))}:{})}]))};download(JSON.stringify(data,null,2),'anketa-spina-v2-draft-'+dateStamp()+'.json','application/json;charset=utf-8');}

function askConfirm(title,message,callback,buttonLabel='Продолжить'){document.getElementById('confirm-title').textContent=title;document.getElementById('confirm-message').textContent=message;document.getElementById('confirm-yes').textContent=buttonLabel;confirmCallback=callback;document.getElementById('confirm-dialog').showModal();}
function clearAnswers(){resetSubmissionState();state={answers:{},step:0,persist:false,updatedAt:null};try{localStorage.removeItem(STORAGE_KEY);storageError=false;}catch(e){storageError=true;}render();document.getElementById('print-summary').innerHTML='';document.getElementById('copy-area').value='';notify(storageError?'Ответы в этой вкладке удалены; браузер не позволил проверить удаление сохранённого черновика.':'Ответы и сохранённый черновик удалены.');}
function preparePrint(){const content=SCHEMA.sections.map(s=>{const qs=visibleQuestions(s).filter(q=>showUnanswered||hasAnswer(q));if(!qs.length)return'';return `<h2>${esc(s.title)}</h2>`+qs.map(q=>`<div class="answer-item"><div class="answer-label">${esc(q.label)}</div><div class="answer-value">${esc(formatAnswer(q))}</div></div>`).join('');}).join('');document.getElementById('print-summary').innerHTML=`<h1>История боли в спине</h1><p class="print-meta">Ответы на анкету · ${esc(new Date().toLocaleString('ru-RU'))}<br>Сведения со слов заполнившей анкету. Версия вопросов: 2. Ответы требуют сопоставления с осмотром и снимками.</p>${content||'<p>Анкета пока не заполнена.</p>'}`;}
document.addEventListener('input',e=>{const el=e.target,id=el.dataset.q,q=questionsById.get(id);if(!q||['radio','checkbox'].includes(el.type)||el.tagName==='SELECT')return;if(el.dataset.row!==undefined){const rows=Array.isArray(state.answers[id])?[...state.answers[id]]:[];const i=Number(el.dataset.row);rows[i]={...rows[i],[el.dataset.col]:el.value};setAnswer(id,rows);return;}if(el.dataset.field){const o=state.answers[id]&&typeof state.answers[id]==='object'&&!Array.isArray(state.answers[id])?state.answers[id]:{};setAnswer(id,{...o,[el.dataset.field]:el.value});return;}setAnswer(id,el.value);});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='persist-toggle'){state.persist=el.checked;if(!el.checked){try{localStorage.removeItem(STORAGE_KEY);storageError=false;}catch(err){storageError=true;notify('Не удалось удалить ранее сохранённый черновик. Проверь настройки хранения данных сайта в браузере.');}}persist();render(true);return;}if(el.id==='show-unanswered'){showUnanswered=el.checked;render(true);return;}const id=el.dataset.q,q=questionsById.get(id);if(!q)return;if(el.dataset.row!==undefined&&el.tagName==='SELECT'){const rows=Array.isArray(state.answers[id])?[...state.answers[id]]:[];const i=Number(el.dataset.row);rows[i]={...rows[i],[el.dataset.col]:el.value};setAnswer(id,rows);return;}if(el.type==='radio'){if(el.dataset.field){const o=state.answers[id]&&typeof state.answers[id]==='object'&&!Array.isArray(state.answers[id])?state.answers[id]:{};setAnswer(id,{...o,[el.dataset.field]:el.value},true);}else setAnswer(id,el.value,true);return;}if(el.type==='checkbox'&&q.type==='multi'){let arr=Array.isArray(state.answers[id])?[...state.answers[id]]:[];if(el.checked){arr=isExclusive(el.value,q)?[el.value]:[...arr.filter(v=>!isExclusive(v,q)),el.value];}else arr=arr.filter(v=>v!==el.value);setAnswer(id,[...new Set(arr)],true);return;}if(el.type==='date')render(true);});
document.addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const action=btn.dataset.action,id=btn.dataset.q,q=questionsById.get(id);switch(action){case'navigate':navigate(Number(btn.dataset.step));break;case'next':navigate(state.step+1);break;case'previous':navigate(state.step-1);break;case'skip':setAnswer(id,sectionsByQuestion.get(id)==='health'?'__decline':'__skip',true);break;case'unskip':delete state.answers[id];persist();render();document.getElementById('label-'+id)?.scrollIntoView({block:'nearest'});break;case'scale':setAnswer(id,btn.dataset.value==='unknown'?'__unknown':Number(btn.dataset.value),true);break;case'add-row':{const rows=Array.isArray(state.answers[id])?[...state.answers[id]]:[];if(rows.length<(q.maxRows||8)){rows.push({});setAnswer(id,rows,true);document.getElementById(`control-${id}-${rows.length-1}-${q.columns[0].key}`)?.focus({preventScroll:true});}break;}case'remove-row':{const rows=[...(state.answers[id]||[])];const i=Number(btn.dataset.row);const remove=()=>{rows.splice(i,1);setAnswer(id,rows,true);};if(q.columns.some(c=>String(rows[i]?.[c.key]??'').trim()))askConfirm('Удалить запись?','Эта запись будет удалена из текущего черновика.',remove,'Удалить');else remove();break;}case'draft':exportDraft();break;case'txt':download('\ufeff'+summaryText(),'anketa-spina-v2-answers-'+dateStamp()+'.txt','text/plain;charset=utf-8');break;case'import':document.getElementById('draft-file').click();break;case'submit':submitAnswers();break;case'share':await shareAnswers();break;case'copy':await copyAnswers();break;case'close-legacy':document.getElementById('legacy-dialog').close();break;case'close-copy':document.getElementById('copy-dialog').close();break;case'print':preparePrint();window.print();break;case'clear':askConfirm('Удалить все ответы?','Будут удалены ответы в этой вкладке и сохранённый черновик в этом браузере. Скачанные ранее файлы останутся у тебя.',clearAnswers,'Удалить ответы');break;case'cancel-confirm':confirmCallback=null;document.getElementById('confirm-dialog').close();break;case'accept-confirm':{const cb=confirmCallback;confirmCallback=null;document.getElementById('confirm-dialog').close();if(cb)cb();break;}}});
document.getElementById('confirm-dialog').addEventListener('cancel',()=>{confirmCallback=null;});
document.getElementById('draft-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>1024*1024){notify('Файл слишком большой. Выбери JSON-черновик этой анкеты.');return;}try{const data=JSON.parse(await file.text());if(data.questionnaireId===LEGACY_ID){document.getElementById('legacy-dialog').showModal();return;}if(data.questionnaireId!==APP_ID||data.version!==SCHEMA_VERSION)throw new Error('Это не черновик этой версии анкеты.');const answers=safeAnswers(data.answers);const apply=()=>{state.answers=answers;state.step=Math.max(0,Math.min(SCHEMA.sections.length,Number(data.step)||0));persist();render();notify('Черновик открыт.');};if(Object.keys(state.answers).length)askConfirm('Открыть другой черновик?','Текущие ответы будут заменены ответами из файла. При необходимости сначала скачай текущий черновик.',apply,'Открыть');else apply();}catch(err){notify(err.message==='Это не черновик этой версии анкеты.'?err.message:'Не удалось прочитать черновик. Выбери JSON-файл, скачанный из этой анкеты.');}});
window.addEventListener('hashchange',updateSubmissionUi);
window.addEventListener('beforeprint',preparePrint);
window.addEventListener('beforeunload',e=>{if((!state.persist||storageError)&&counts().filled>0){e.preventDefault();e.returnValue='';}});
render();
</script>
